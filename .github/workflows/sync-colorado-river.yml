name: Sync Colorado River charts

on:
  schedule:
    # Day 2 of each month, 12:00 UTC -- a day after colorado-river-viz's
    # publish workflow runs, so its release is already in place.
    - cron: "0 12 2 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download latest chart export
        run: |
          mkdir -p projects/colorado-river
          gh release download site-export-latest \
            --repo rengibbons/colorado-river-viz \
            --dir projects/colorado-river \
            --pattern "*.html" \
            --clobber

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/colorado-river
          if git diff --cached --quiet; then
            echo "No changes to the Colorado River charts this run."
          else
            git commit -m "Sync Colorado River charts"
            git push
          fi
